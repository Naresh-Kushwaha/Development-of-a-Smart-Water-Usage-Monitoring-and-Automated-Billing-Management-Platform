apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartwater-backend-deployment
  labels:
    app: smartwater-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartwater-backend
  template:
    metadata:
      labels:
        app: smartwater-backend
    spec:
      containers:
        - name: smartwater-backend
          image: nareshkushwaha/smartwater-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: DB_PASSWORD
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: MAIL_HOST

            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: MAIL_PORT
            - name: MAIL_USER
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: MAIL_USER
            - name: MAIL_PASSWORD
              valueFrom:  
                configMapKeyRef:
                  name: smartwater-config
                  key: MAIL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: JWT_SECRET
            - name: SEED_DEMO
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: SEED_DEMO
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: CORS_ORIGINS
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: BACKEND_URL
            - name: REDIS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: REDIS_ENABLED
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: REDIS_HOST
                  
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: REDIS_PORT
            - name: KAFKA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: KAFKA_ENABLED
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: KAFKA_BOOTSTRAP
            - name: MAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: MAIL_ENABLED 
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: PUBLIC_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: GOOGLE_CLIENT_SECRET
            - name: ALERT_CRON
              valueFrom:
                configMapKeyRef:
                  name: smartwater-config
                  key: ALERT_CRON



---
apiVersion: v1
kind: Service
metadata:
  name: smartwater-backend-service
spec:
  type: LoadBalancer
  selector:
    app: smartwater-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

          

