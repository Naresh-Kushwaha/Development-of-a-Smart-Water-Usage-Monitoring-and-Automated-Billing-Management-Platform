# Demo-grade Redis inside the cluster (no persistence - it only holds cache, counters, locks and short-lived tickets).
# For production prefer Amazon ElastiCache: point REDIS_HOST at it and delete this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  # namespace: smartwater
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  # namespace: smartwater
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
