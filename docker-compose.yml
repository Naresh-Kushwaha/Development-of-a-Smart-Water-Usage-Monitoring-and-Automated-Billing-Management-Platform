services:
  
  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME must be set}/smartwater-backend:latest
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-secret-of-32+bytes}
      SEED_DEMO: true
      CORS_ORIGINS: ${CORS_ORIGINS}

    ports: ["8080:8080"]

  frontend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME must be set}/smartwater-frontend:latest
    depends_on: [backend]
    ports: ["3000:80"]
