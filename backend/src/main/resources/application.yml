server:
  port: 8080
spring:
  application.name: smart-water-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart.max-file-size: 5MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties.mail.smtp.auth: ${MAIL_AUTH:true}
    properties.mail.smtp.starttls.enable: ${MAIL_TLS:true}
    properties.mail.smtp.connectiontimeout: 3000
    properties.mail.smtp.timeout: 3000
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 720
  cors-origins: ${CORS_ORIGINS}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_USER}
  alerts.cron: ${ALERT_CRON}
  seed-demo: ${SEED_DEMO}
  payment-instructions: ${PAYMENT_INSTRUCTIONS:Pay at the apartment office or by bank transfer to the association account. Quote your unit number as the reference.}
springdoc:
  swagger-ui.path: /swagger-ui.html
