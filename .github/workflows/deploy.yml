
name: CI/CD - React and Spring Boot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  BACKEND_IMAGE: nareshkushwaha/backend-smart-water-platform:latest
  FRONTEND_IMAGE: nareshkushwaha/frontend-smart-water-platform:latest

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test Spring Boot backend
        working-directory: backend
        run: mvn -B clean verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      
      - name: Validate Docker Compose
        run: |
          cat > .env.ci <<'EOF'
          IMAGE_TAG=latest
          DB_NAME=smartwater
          DB_USER=smartwater
          DB_PASSWORD=ci-password
          JWT_SECRET=ci-only-placeholder-secret-for-testing
          SEED_DEMO=false
          CORS_ORIGINS=http://localhost:3000
          EOF

          docker compose -f ./docker-compose.yml --env-file .env.ci config --quiet
          status=$?
          rm -f .env.ci
          exit $status


  publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
           ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
           ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Ubuntu EC2
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/your-project/

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu

            cd /opt/your-project

            echo "Deploying version: $IMAGE_TAG"

            sudo IMAGE_TAG="$IMAGE_TAG" \
              docker compose pull frontend backend

            sudo IMAGE_TAG="$IMAGE_TAG" \
              docker compose up -d --remove-orphans

            sudo docker compose ps

            for attempt in $(seq 1 12); do
              if curl -fsS http://127.0.0.1/ >/dev/null; then
                echo "Frontend is responding."
                exit 0
              fi

              echo "Waiting for frontend..."
              sleep 5
            done

            echo "Frontend did not become available."
            sudo docker compose logs --tail=100 frontend backend
            exit 1
