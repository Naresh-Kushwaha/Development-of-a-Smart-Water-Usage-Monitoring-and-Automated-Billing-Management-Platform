
name: SmartWater CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/smartwater
          port: 22

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          ALERT_CRON: ${{ secrets.ALERT_CRON }}
          REDIS_ENABLED: ${{ secrets.REDIS_ENABLED }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          KAFKA_ENABLED : ${{ secrets.KAFKA_ENABLED }}
          KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          





        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DB_PASSWORD,DB_USER,DB_URL,JWT_SECRET,CORS_ORIGINS
          script: |
            set -eu
            cd /opt/smartwater

            umask 077
            printf '%s\n' \
              "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "DB_USER=$DB_USER" \
              "DB_URL=$DB_URL" \
              "JWT_SECRET=$JWT_SECRET" \
              "CORS_ORIGINS=$CORS_ORIGINS" \
              "MAIL_HOST=$MAIL_HOST" \
              "MAIL_PORT=$MAIL_PORT" \
              "MAIL_USER=$MAIL_USER" \
              "MAIL_PASSWORD=$MAIL_PASSWORD" \
              "ALERT_CRON=$ALERT_CRON" \
              "REDIS_ENABLED=$REDIS_ENABLED" \
              "REDIS_HOST=$REDIS_HOST" \
              "KAFKA_ENABLED=$KAFKA_ENABLED" \
              "KAFKA_BOOTSTRAP=$KAFKA_BOOTSTRAP" \
              "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
              "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
              "SEED_DEMO=false" > .env

            # Pull the latest application images
            sudo docker compose pull backend frontend

            # Start or update the application
            sudo docker compose up -d --remove-orphans

            # Display the status of all services
            sudo docker compose ps
