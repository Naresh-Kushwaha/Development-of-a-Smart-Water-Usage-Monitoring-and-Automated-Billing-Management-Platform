
name: SmartWater CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartwater-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/smartwater
          port: 22

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DB_PASSWORD,JWT_SECRET,CORS_ORIGINS
          script: |
            set -eu
            cd /opt/smartwater

            umask 077
            printf '%s\n' \
              "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "JWT_SECRET=$JWT_SECRET" \
              "CORS_ORIGINS=$CORS_ORIGINS" \
              "SEED_DEMO=false" > .env

            # Pull the latest application images
            sudo docker compose pull backend frontend

            # Start or update the application
            sudo docker compose up -d --remove-orphans

            # Display the status of all services
            sudo docker compose ps
